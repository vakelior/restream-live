name: Restream Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # بحد أقصى 6 ساعات (حد GitHub)
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تثبيت ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: بث قناة Black الموسيقية 1080p عبر RTMP (نسخ بدون ترميز)
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          IURL="${IPTV_URL:-https://dash2.antik.sk/live/test_ocko_black/playlist.m3u8}"
          RURL="${RTMP_URL:-rtmp://live.restream.io/live/re_12000328_event11d497e43c154270ae00c867bf7d2225}"

          echo "==> مصدر البث (IPTV): $IURL"
          echo "==> الهدف (Restream)   : $RURL"
          echo "==> بدء البث بجودة 1080p (نسخ مباشر بدون ترميز)"

          # حلقة لا نهائية: إعادة تشغيل تلقائية عند انقطاع الاتصال
          for i in $(seq 1 999999); do
            echo "----- المحاولة #$i -----"
            timeout 330m ffmpeg -hide_banner -loglevel warning \
              -re -i "$IURL" \
              -c:v copy -c:a copy \
              -f flv -flvflags no_duration_filesize \
              "$RURL"
            echo "----- انقطع الاتصال، إعادة محاولة بعد 5 ثوانٍ -----"
            sleep 5
          done
