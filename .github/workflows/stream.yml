name: Restream Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
    - cron: '30 1,6,11,16,21 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تثبيت ffmpeg حديث عبر PPA الرسمي
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: بث الصوت (صورة سوداء ثابتة + صوت) عبر RTMP
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          RURL="${RTMP_URL}"
          echo "==> الهدف (Restream): ${RURL}"
          echo "==> تحويل base64 الى ملف الثنائي..."
          base64 -d song.mp4 > song_real.mp4 2>/dev/null || true
          if [ -s song_real.mp4 ] && file song_real.mp4 | grep -qi 'ISO Media'; then
            ACTUAL="song_real.mp4"
            echo "==> نجح فك الترميز -> song_real.mp4"
          else
            ACTUAL="song.mp4"
            echo "==> الملف ثنائي أصلاً -> song.mp4"
          fi
          rm -f song_real.mp4 2>/dev/null || true
          ls -la "$ACTUAL"

          for i in $(seq 1 999999); do
            echo "----- الدورة #$i -----"
            timeout 330m ffmpeg -hide_banner -loglevel warning \
              -re -stream_loop -1 -i "$ACTUAL" \
              -map 0:a:0 \
              -f lavfi -i "color=black:s=640x360:r=10" \
              -shortest \
              -map 1:v:0 -map 0:a:0 \
              -c:v libx264 -preset ultrafast -b:v 100k -pix_fmt yuv420p \
              -c:a aac -b:a 96k \
              -f flv -flvflags no_duration_filesize \
              "$RURL"
            echo "----- انقطع الاتصال، إعادة محاولة بعد 5 ثوانٍ -----"
            sleep 5
          done
