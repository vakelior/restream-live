name: Restream Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
    - cron: '30 1,6,11,16,21 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تثبيت ffmpeg حديث عبر PPA الرسمي
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: بث الأغنية (loop لا نهائي) عبر RTMP
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          RURL="${RTMP_URL}"
          echo "==> الهدف (Restream): ${RURL}"
          echo "==> الملف: song.mp4 (موجود في المستودع)"
          ls -la song.mp4

          for i in $(seq 1 999999); do
            echo "----- الدورة #$i -----"
            timeout 330m ffmpeg -hide_banner -loglevel warning \
              -re -stream_loop -1 -i "song.mp4" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy -c:a copy \
              -f flv -flvflags no_duration_filesize \
              "$RURL"
            echo "----- انقطع الاتصال، إعادة محاولة بعد 5 ثوانٍ -----"
            sleep 5
          done
