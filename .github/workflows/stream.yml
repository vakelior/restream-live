name: Restream Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
    - cron: '30 1,6,11,16,21 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تثبيت ffmpeg حديث عبر PPA الرسمي
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: بث قناة Panorama FM الموسيقية 1080p عبر RTMP (نسخ بدون ترميز)
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          IURL="${IPTV_URL:-https://d6izdil55uftn.cloudfront.net/out/v1/0a06d1d6377c47edbd48721ed724bd08/index_7.m3u8}"
          RURL="${RTMP_URL:-rtmp://live.restream.io/live/re_12000328_event11d497e43c154270ae00c867bf7d2225}"
          echo "==> مصدر البث (1080p): $IURL"
          echo "==> الهدف (Restream) : $RURL"
          echo "==> بدء البث بجودة 1080p (نسخ مباشر بدون ترميز)"
          for i in $(seq 1 999999); do
            echo "----- المحاولة #$i -----"
            timeout 330m ffmpeg -hide_banner -loglevel warning \
              -re -i "$IURL" \
              -map 0:v:0 -map 0:a:0 \
              -c:v copy -c:a copy \
              -f flv -flvflags no_duration_filesize \
              "$RURL"
            echo "----- انقطع الاتصال، إعادة محاولة بعد 5 ثوانٍ -----"
            sleep 5
          done
